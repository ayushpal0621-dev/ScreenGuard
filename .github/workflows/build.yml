name: Build ScreenGuard

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --collect-all PySide6 --name ScreenGuard main.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ScreenGuard -DestinationPath dist/ScreenGuard-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGuard-Windows
          path: dist/ScreenGuard-Windows.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS executable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --collect-all PySide6 --name ScreenGuard main.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r ScreenGuard-macOS.zip ScreenGuard

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGuard-macOS
          path: dist/ScreenGuard-macOS.zip
